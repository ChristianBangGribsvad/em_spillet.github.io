<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ─────────────────────────────────────────────── */
    :root {
      --pitch:     #1a3a2a;
      --turf:      #25a244;
      --gold:      #b8860b;
      --gold-light: #fff8e1;
      --off-white: #f5f5f0;
      --white:     #ffffff;
      --text:      #1c1c1c;
      --muted:     #666666;
      --border:    #dddddd;
      --nav-h:     3.25rem;
      --r:         0.5rem;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--off-white);
      color: var(--text);
      line-height: 1.6;
      font-size: 16px;
    }

    /* ── Sticky nav bar ─────────────────────────────────────── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--pitch);
      background-image: repeating-linear-gradient(
        -45deg,
        transparent 0px, transparent 10px,
        rgba(255,255,255,0.04) 10px, rgba(255,255,255,0.04) 20px
      );
      box-shadow: 0 2px 16px rgba(0,0,0,0.45);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .site-title {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--white);
      text-decoration: none;
      white-space: nowrap;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .site-nav {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }
    .site-nav::-webkit-scrollbar { display: none; }

    .site-nav a {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      padding: 0.25rem 0.8rem;
      border-radius: 2rem;
      border: 1px solid rgba(255,255,255,0.25);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .site-nav a:hover {
      background: var(--turf);
      color: var(--white);
      border-color: var(--turf);
    }
    .nav-divider {
      width: 1px;
      align-self: stretch;
      background: rgba(255,255,255,0.2);
      margin: 0.25rem 0.15rem;
      flex-shrink: 0;
    }
    .nav-rules { border-style: dashed !important; opacity: 0.85; }
    .nav-rules:hover { border-style: solid !important; opacity: 1; }

    /* ── Hero banner (homepage only) ────────────────────────── */
    .site-hero {
      position: relative;
      background-color: var(--pitch);
      background-image:
        linear-gradient(to bottom, rgba(10,25,15,0.55) 0%, rgba(10,25,15,0.80) 100%),
        url('{{ '/assets/images/fifa1.jpg' | absolute_url }}');
      background-size: cover;
      background-position: center 35%;
      text-align: center;
      padding: 12rem 1.5rem 11rem;
      color: var(--white);
    }

    .hero-title {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--white);
      text-shadow: 0 3px 24px rgba(0,0,0,0.6);
      line-height: 1.1;
      margin-bottom: 0.6rem;
    }

    .hero-sub {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.72);
      font-style: italic;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 8px rgba(0,0,0,0.5);
    }

    .hero-badge {
      display: inline-block;
      margin-top: 1.25rem;
      background: var(--gold);
      color: var(--white);
      font-family: 'Oswald', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.35rem 1rem;
      border-radius: 2rem;
    }

    /* ── Page layout ────────────────────────────────────────── */
    .page-content { min-height: calc(100vh - var(--nav-h) - 3rem); }

    .content-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    img { max-width: 100%; height: auto; display: block; }

    /* ── Schmeichel card ────────────────────────────────────── */
    .schmeichel-card {
      background: var(--gold-light);
      border-left: 5px solid var(--gold);
      border-radius: var(--r);
      padding: 1.25rem 1.75rem 1.5rem;
      margin-bottom: 2.5rem;
      box-shadow: 0 2px 12px rgba(184,134,11,0.18);
    }

    .schmeichel-card h1 {
      font-family: 'Oswald', 'Arial Narrow', sans-serif !important;
      font-size: 1.45rem !important;
      font-weight: 700 !important;
      color: #5a3000 !important;
      background: none !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
      margin: 0 0 0.6rem !important;
      padding: 0 !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    /* Override .content-wrapper ul flex/pill styles inside the card */
    .schmeichel-card ul {
      display: block !important;
      background: none !important;
      border: none !important;
      border-radius: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      gap: 0 !important;
      list-style: none;
    }
    .schmeichel-card li { display: block; font-size: 1rem; padding: 0.2rem 0; }
    .schmeichel-card li a {
      display: inline !important;
      background: none !important;
      color: var(--turf) !important;
      padding: 0 !important;
      border-radius: 0 !important;
      font-weight: 600;
      text-decoration: none;
    }
    .schmeichel-card li a:hover { text-decoration: underline !important; }

    /* ── Leaderboard ────────────────────────────────────────── */
    .leaderboard {
      background: var(--white);
      border-left: 5px solid var(--turf);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-radius: 0 0 var(--r) var(--r);
      overflow: hidden;
    }
    .lb-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.55rem 1rem;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .lb-row:last-child { border-bottom: none; }
    .lb-row:not(.lb-gold):not(.lb-silver):not(.lb-bronze):hover {
      background: var(--off-white);
    }
    .lb-gold   { background: linear-gradient(90deg, rgba(212,175,55,0.18) 0%, transparent 65%); }
    .lb-silver { background: linear-gradient(90deg, rgba(160,160,160,0.14) 0%, transparent 65%); }
    .lb-bronze { background: linear-gradient(90deg, rgba(180,100,50,0.14) 0%, transparent 65%); }

    .lb-pos {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      min-width: 2.2rem;
      text-align: center;
      color: var(--muted);
    }
    .lb-gold   .lb-pos { font-size: 1.35rem; }
    .lb-silver .lb-pos { font-size: 1.2rem;  }
    .lb-bronze .lb-pos { font-size: 1.1rem;  }

    .lb-info {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
    }
    .lb-info a { color: var(--pitch); font-weight: 600; text-decoration: none; }
    .lb-info a:hover { color: var(--turf); text-decoration: underline; }
    .lb-info small {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--muted);
    }

    .lb-pts {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      color: var(--pitch);
    }
    .lb-gold   .lb-pts { color: #b8860b; }
    .lb-silver .lb-pts { color: #707070; }
    .lb-bronze .lb-pts { color: #a0522d; }

    .lb-empty { padding: 0.75rem 1rem; color: var(--muted); font-style: italic; }

    /* ── Team standings (HTML table on team pages) ───────────── */
    .team-standings {
      background: var(--white);
      border-left: 5px solid var(--turf);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-radius: 0 0 var(--r) var(--r);
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
    .ts-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.55rem 1rem;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .ts-row:last-child { border-bottom: none; }
    .ts-gold   { background: linear-gradient(90deg, rgba(212,175,55,0.18) 0%, transparent 65%); }
    .ts-silver { background: linear-gradient(90deg, rgba(160,160,160,0.14) 0%, transparent 65%); }
    .ts-bronze { background: linear-gradient(90deg, rgba(180,100,50,0.14) 0%, transparent 65%); }
    .ts-pos {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      min-width: 2.2rem;
      text-align: center;
      color: var(--muted);
    }
    .ts-gold   .ts-pos { font-size: 1.35rem; }
    .ts-silver .ts-pos { font-size: 1.2rem;  }
    .ts-bronze .ts-pos { font-size: 1.1rem;  }
    .ts-name { flex: 1; font-size: 0.9rem; font-weight: 500; color: var(--text); }
    .ts-name a { color: var(--text); text-decoration: none; font-weight: 600; }
    .ts-name a:hover { color: var(--turf); text-decoration: underline; }
    .ts-pts {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--pitch);
    }
    .ts-gold   .ts-pts { color: #b8860b; }
    .ts-silver .ts-pts { color: #707070; }
    .ts-bronze .ts-pts { color: #a0522d; }
    .ts-empty { padding: 0.75rem 1rem; color: var(--muted); font-style: italic; margin: 0; }

    /* ── Participant predictions table ───────────────────── */
    .pred-table {
      background: var(--white);
      border-left: 5px solid var(--turf);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-radius: 0 0 var(--r) var(--r);
      overflow: hidden;
      margin-bottom: 1.5rem;
      font-size: 0.82rem;
    }
    .pred-col-header {
      display: grid;
      grid-template-columns: 1fr 5.5rem 5.5rem 3.5rem;
      gap: 0.4rem;
      padding: 0.3rem 0.75rem;
      background: var(--off-white);
      border-bottom: 2px solid var(--border);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .pred-col-header span:nth-child(n+2) { text-align: center; }

    .pred-section { border-bottom: 2px solid var(--border); }
    .pred-section:last-child { border-bottom: none; }

    .pred-section-header {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: rgba(255,255,255,0.9);
      background: var(--pitch);
      padding: 0.28rem 0.75rem;
    }
    .pred-divider {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: var(--off-white);
      padding: 0.2rem 0.75rem;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .pred-row {
      display: grid;
      grid-template-columns: 1fr 5.5rem 5.5rem 3.5rem;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.75rem;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }
    .pred-row:last-child { border-bottom: none; }
    .pred-match  { color: var(--text); line-height: 1.3; }
    .pred-guess  { text-align: center; font-weight: 600; color: var(--pitch); }
    .pred-result { text-align: center; color: var(--muted); }

    .pts-badge {
      display: block;
      text-align: center;
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.15rem 0.3rem;
      border-radius: 0.25rem;
      color: var(--white);
      background: var(--border);
    }

    /* Row tint + badge colour per point level */
    .pts-15 { background: rgba(20, 83, 45, 0.08); }
    .pts-15 .pts-badge { background: #14532d; }
    .pts-10 { background: rgba(22, 101, 52, 0.07); }
    .pts-10 .pts-badge { background: #166534; }
    .pts-7  { background: rgba(15, 118, 110, 0.07); }
    .pts-7  .pts-badge { background: #0f766e; }
    .pts-5  { background: rgba(77, 124, 15, 0.07); }
    .pts-5  .pts-badge { background: #4d7c0f; }
    .pts-2  { background: rgba(146, 64, 14, 0.08); }
    .pts-2  .pts-badge { background: #92400e; }
    .pts-0  { background: rgba(127, 29, 29, 0.07); }
    .pts-0  .pts-badge { background: #7f1d1d; }
    .pts-unplayed .pts-badge { background: var(--border); color: var(--muted); }

    .pred-total {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.75rem;
      background: var(--pitch);
      color: rgba(255,255,255,0.65);
      font-size: 0.82rem;
    }
    .pred-total-pts {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--white);
    }
    .pred-placeholder { padding: 1rem; color: var(--muted); font-style: italic; }

    /* ── Rules page ──────────────────────────────────────── */
    .rules-table {
      background: var(--white);
      border-left: 5px solid var(--turf);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-radius: 0 0 var(--r) var(--r);
      overflow: hidden;
      margin: 0.75rem 0 1.5rem;
    }
    .rules-row {
      display: grid;
      grid-template-columns: 7rem 1fr;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      font-size: 0.88rem;
    }
    .rules-row:last-child { border-bottom: none; }
    .rules-header {
      background: var(--off-white);
      border-bottom: 2px solid var(--border) !important;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .rules-pts {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--pitch);
    }
    /* inherit row tints from .pts-* classes defined above */
    kbd {
      display: inline-block;
      background: var(--off-white);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 0.1rem 0.45rem;
      font-size: 0.8rem;
      font-family: monospace;
      color: var(--text);
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .pred-table { font-size: 0.75rem; }
      .pred-row, .pred-col-header {
        grid-template-columns: 1fr 4.5rem 4.5rem 3rem;
        gap: 0.3rem;
        padding: 0.3rem 0.5rem;
      }
    }

    /* ── Next Matches card body ─────────────────────────────── */
    .next-matches {
      background: var(--white);
      border-left: 5px solid var(--turf);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-radius: 0 0 var(--r) var(--r);
      padding: 0.75rem 1rem 1rem;
      text-align: center;
    }
    .next-matches p {
      margin: 0.25rem 0;
      font-size: 0.95rem;
      color: var(--text);
    }
    .next-matches em { color: var(--muted); }

    /* Yesterday's Results — same card style as Next Matches */
    .yesterdays-results {
      background: var(--white);
      border-left: 5px solid var(--turf);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-radius: 0 0 var(--r) var(--r);
      padding: 0.75rem 1rem 1rem;
      text-align: center;
    }
    .yesterdays-results p { margin: 0.25rem 0; font-size: 0.95rem; color: var(--text); }
    .yesterdays-results em { color: var(--muted); }

    /* ── Team-group section headings ────────────────────────── */
    .content-wrapper h1 {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--white);
      background: var(--pitch);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.55rem 1rem;
      margin: 2.5rem 0 0;
      border-left: 5px solid var(--turf);
      border-radius: var(--r) var(--r) 0 0;
    }
    .content-wrapper h1:first-child { margin-top: 0; }

    .content-wrapper h2 {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin: 0;
      padding: 0.55rem 1rem;
      background: var(--white);
      border-left: 5px solid var(--turf);
      border-right: 1px solid var(--border);
    }

    /* ── SVG grid ───────────────────────────────────────────── */
    .svg-grid {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      background: var(--white);
      padding: 1rem;
      border-left: 5px solid var(--turf);
      border-right: 1px solid var(--border);
    }
    .svg-grid p { margin: 0; }
    .svg-grid img {
      width: 100%;
      border-radius: calc(var(--r) - 2px);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    /* ── Participant pill list ───────────────────────────────── */
    .content-wrapper ul {
      list-style: none;
      padding: 0.7rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      background: var(--white);
      border-left: 5px solid var(--turf);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-radius: 0 0 var(--r) var(--r);
      margin-bottom: 0;
    }
    .content-wrapper li a {
      display: inline-block;
      background: var(--pitch);
      color: var(--white);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.28rem 0.9rem;
      border-radius: 2rem;
      text-decoration: none;
      transition: filter 0.15s;
    }
    .content-wrapper li a:hover { filter: brightness(1.4); }

    /* ── Divider ────────────────────────────────────────────── */
    .content-wrapper hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    /* ── Back link (participant pages) ─────────────────────── */
    .content-wrapper p > a[href*="github.io"] {
      display: inline-block;
      background: var(--turf);
      color: var(--white);
      text-decoration: none;
      padding: 0.5rem 1.4rem;
      border-radius: 2rem;
      font-size: 0.9rem;
      font-weight: 500;
      margin-top: 1.5rem;
      transition: background 0.15s;
    }
    .content-wrapper p > a[href*="github.io"]:hover { background: var(--pitch); }

    /* ── User score SVG on participant pages ─────────────────── */
    .content-wrapper p > img[src*="user_plots"] {
      max-width: 900px;
      margin: 0.5rem auto;
      border-radius: var(--r);
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    /* ── Footer ─────────────────────────────────────────────── */
    .site-footer {
      background: var(--pitch);
      color: rgba(255,255,255,0.4);
      text-align: center;
      padding: 1rem;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 600px) {
      .header-inner {
        height: auto;
        flex-direction: column;
        align-items: flex-start;
        padding: 0.6rem 1rem;
        gap: 0.35rem;
      }
      .site-nav { width: 100%; padding-bottom: 0.4rem; }
      .content-wrapper { padding: 1.25rem 1rem 3rem; }
      .svg-grid { padding: 0.5rem; gap: 0.75rem; }
      .content-wrapper h1 { font-size: 1.35rem; }
      .site-hero { padding: 7rem 1rem 6rem; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="site-title" href="{{ '/' | absolute_url }}">&#x26BD; {{ site.title }}</a>
      <nav class="site-nav" aria-label="Team groups">
        {% for group in site.data.groups %}
        <a href="{{ '/pages/' | append: group.slug | append: '.html' | absolute_url }}"
           data-teamcolor="{{ group.color }}"
           style="border-color: {{ group.color }};">{{ group.name }}</a>
        {% endfor %}
        <span class="nav-divider"></span>
        <a href="{{ '/pages/rules.html' | absolute_url }}" class="nav-rules">📋 Rules</a>
      </nav>
    </div>
  </header>

  {% if page.path == 'index.md' %}
  <section class="site-hero">
    <div class="hero-title">&#x1F3C6; {{ site.title }}</div>
    <p class="hero-sub">{{ site.description }}</p>
    <span class="hero-badge">&#x1F30D; June 11 &ndash; July 19, 2026</span>
  </section>
  {% endif %}

  <main class="page-content">
    <div class="content-wrapper">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <p>WC 2026 Prediction Game &middot; Updated hourly</p>
  </footer>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;

    // 1. Wrap the Schmeichel heading + following siblings in a gold card
    var schmeichelH1 = Array.from(wrapper.querySelectorAll('h1')).find(function (h) {
      return h.textContent.indexOf('Schmeichel') !== -1;
    });
    if (schmeichelH1) {
      var card = document.createElement('div');
      card.className = 'schmeichel-card';
      schmeichelH1.parentNode.insertBefore(card, schmeichelH1);
      var node = schmeichelH1;
      while (node) {
        var next = node.nextSibling;
        card.appendChild(node);
        if (!next || (next.nodeType === 1 && next.tagName === 'H1')) break;
        node = next;
      }
    }

    // 2. Wrap every 3 consecutive group-plot images into a CSS grid
    var imgParas = Array.from(wrapper.querySelectorAll('p > img'))
      .filter(function (img) { return img.src.indexOf('group_plots') !== -1; })
      .map(function (img) { return img.closest('p'); });
    for (var i = 0; i < imgParas.length; i += 3) {
      var trio = imgParas.slice(i, i + 3);
      if (trio.length < 1) break;
      var grid = document.createElement('div');
      grid.className = 'svg-grid';
      trio[0].parentNode.insertBefore(grid, trio[0]);
      trio.forEach(function (p) { grid.appendChild(p); });
    }

    // 3. Section heading colours
    //    If this page declares a team_color in front matter, every h1 uses it
    //    (team pages and participant pages have one h1 each).
    //    Otherwise the front page cycles through the palette.
    var PAGE_TEAM_COLOR = '{{ page.team_color | default: "" }}';
    var PALETTE = [
      '#1e3a5f',  // deep navy
      '#5c1f78',  // deep violet
      '#8b1a1a',  // deep crimson
      '#0d4d4d',  // dark teal
      '#2d5a0d',  // dark moss
      '#7a3a00'   // dark amber
    ];
    Array.from(wrapper.querySelectorAll('h1'))
      .filter(function (h) { return !h.closest('.schmeichel-card'); })
      .forEach(function (h, i) {
        h.style.background = PAGE_TEAM_COLOR || PALETTE[i % PALETTE.length];
      });

    // 4. Team-colored nav pill hover
    document.querySelectorAll('.site-nav a[data-teamcolor]').forEach(function (a) {
      var c = a.dataset.teamcolor;
      a.addEventListener('mouseenter', function () {
        a.style.background   = c;
        a.style.borderColor  = c;
        a.style.color        = '#fff';
      });
      a.addEventListener('mouseleave', function () {
        a.style.background  = '';
        a.style.borderColor = c;   // keep colored border at rest
        a.style.color       = '';
      });
    });
  });
  </script>

</body>
</html>
