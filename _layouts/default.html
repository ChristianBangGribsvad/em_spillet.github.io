<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ─────────────────────────────────────────────── */
    :root {
      --pitch:     #1a3a2a;
      --turf:      #25a244;
      --gold:      #b8860b;
      --gold-light: #fff8e1;
      --off-white: #f5f5f0;
      --white:     #ffffff;
      --text:      #1c1c1c;
      --muted:     #666666;
      --border:    #dddddd;
      --nav-h:     3.25rem;
      --r:         0.5rem;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--off-white);
      color: var(--text);
      line-height: 1.6;
      font-size: 16px;
    }

    /* ── Sticky nav bar ─────────────────────────────────────── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--pitch);
      background-image: repeating-linear-gradient(
        -45deg,
        transparent 0px, transparent 10px,
        rgba(255,255,255,0.04) 10px, rgba(255,255,255,0.04) 20px
      );
      box-shadow: 0 2px 16px rgba(0,0,0,0.45);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .site-title {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--white);
      text-decoration: none;
      white-space: nowrap;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .site-nav {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }
    .site-nav::-webkit-scrollbar { display: none; }

    .site-nav a {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      padding: 0.25rem 0.8rem;
      border-radius: 2rem;
      border: 1px solid rgba(255,255,255,0.25);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .site-nav a:hover {
      background: var(--turf);
      color: var(--white);
      border-color: var(--turf);
    }

    /* ── Hero banner (homepage only) ────────────────────────── */
    .site-hero {
      position: relative;
      background-color: var(--pitch);
      background-image:
        linear-gradient(to bottom, rgba(10,25,15,0.55) 0%, rgba(10,25,15,0.80) 100%),
        url('{{ site.baseurl }}/assets/images/fifa1.jpg');
      background-size: cover;
      background-position: center 35%;
      text-align: center;
      padding: 4.5rem 1.5rem 3.5rem;
      color: var(--white);
    }

    .hero-title {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--white);
      text-shadow: 0 3px 24px rgba(0,0,0,0.6);
      line-height: 1.1;
      margin-bottom: 0.6rem;
    }

    .hero-sub {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.72);
      font-style: italic;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 8px rgba(0,0,0,0.5);
    }

    .hero-badge {
      display: inline-block;
      margin-top: 1.25rem;
      background: var(--gold);
      color: var(--white);
      font-family: 'Oswald', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.35rem 1rem;
      border-radius: 2rem;
    }

    /* ── Page layout ────────────────────────────────────────── */
    .page-content { min-height: calc(100vh - var(--nav-h) - 3rem); }

    .content-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    img { max-width: 100%; height: auto; display: block; }

    /* ── Schmeichel card ────────────────────────────────────── */
    .schmeichel-card {
      background: var(--gold-light);
      border-left: 5px solid var(--gold);
      border-radius: var(--r);
      padding: 1.25rem 1.75rem 1.5rem;
      margin-bottom: 2.5rem;
      box-shadow: 0 2px 12px rgba(184,134,11,0.18);
    }

    .schmeichel-card h1 {
      font-family: 'Oswald', 'Arial Narrow', sans-serif !important;
      font-size: 1.45rem !important;
      font-weight: 700 !important;
      color: #5a3000 !important;
      background: none !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
      margin: 0 0 0.6rem !important;
      padding: 0 !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    .schmeichel-card ul { list-style: none; padding: 0; }
    .schmeichel-card li { font-size: 1rem; padding: 0.2rem 0; }
    .schmeichel-card a { color: var(--turf); font-weight: 600; text-decoration: none; }
    .schmeichel-card a:hover { text-decoration: underline; }

    /* ── Team-group section headings ────────────────────────── */
    .content-wrapper h1 {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--white);
      background: var(--pitch);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.55rem 1rem;
      margin: 2.5rem 0 0;
      border-left: 5px solid var(--turf);
      border-radius: var(--r) var(--r) 0 0;
    }
    .content-wrapper h1:first-child { margin-top: 0; }

    .content-wrapper h2 {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin: 0;
      padding: 0.55rem 1rem;
      background: var(--white);
      border-left: 5px solid var(--turf);
      border-right: 1px solid var(--border);
    }

    /* ── SVG grid ───────────────────────────────────────────── */
    .svg-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      background: var(--white);
      padding: 0.75rem;
      border-left: 5px solid var(--turf);
      border-right: 1px solid var(--border);
    }
    .svg-grid p { margin: 0; }
    .svg-grid img {
      width: 100%;
      border-radius: calc(var(--r) - 2px);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    /* ── Participant pill list ───────────────────────────────── */
    .content-wrapper ul {
      list-style: none;
      padding: 0.7rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      background: var(--white);
      border-left: 5px solid var(--turf);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-radius: 0 0 var(--r) var(--r);
      margin-bottom: 0;
    }
    .content-wrapper li a {
      display: inline-block;
      background: var(--pitch);
      color: var(--white);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.28rem 0.9rem;
      border-radius: 2rem;
      text-decoration: none;
      transition: background 0.15s;
    }
    .content-wrapper li a:hover { background: var(--turf); }

    /* ── Divider ────────────────────────────────────────────── */
    .content-wrapper hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    /* ── Back link (participant pages) ─────────────────────── */
    .content-wrapper p > a[href*="github.io"] {
      display: inline-block;
      background: var(--turf);
      color: var(--white);
      text-decoration: none;
      padding: 0.5rem 1.4rem;
      border-radius: 2rem;
      font-size: 0.9rem;
      font-weight: 500;
      margin-top: 1.5rem;
      transition: background 0.15s;
    }
    .content-wrapper p > a[href*="github.io"]:hover { background: var(--pitch); }

    /* ── User score SVG on participant pages ─────────────────── */
    .content-wrapper p > img[src*="user_plots"] {
      max-width: 900px;
      margin: 0.5rem auto;
      border-radius: var(--r);
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    /* ── Footer ─────────────────────────────────────────────── */
    .site-footer {
      background: var(--pitch);
      color: rgba(255,255,255,0.4);
      text-align: center;
      padding: 1rem;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 900px) {
      .svg-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 600px) {
      .header-inner {
        height: auto;
        flex-direction: column;
        align-items: flex-start;
        padding: 0.6rem 1rem;
        gap: 0.35rem;
      }
      .site-nav { width: 100%; padding-bottom: 0.4rem; }
      .content-wrapper { padding: 1.25rem 1rem 3rem; }
      .svg-grid { grid-template-columns: 1fr; padding: 0.5rem; gap: 0.5rem; }
      .content-wrapper h1 { font-size: 1.35rem; }
      .site-hero { padding: 3rem 1rem 2.5rem; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="site-title" href="{{ site.baseurl }}/">&#x26BD; {{ site.title }}</a>
      <nav class="site-nav" id="group-nav" aria-label="Team groups"></nav>
    </div>
  </header>

  {% if page.path == 'index.md' %}
  <section class="site-hero">
    <div class="hero-title">&#x1F3C6; {{ site.title }}</div>
    <p class="hero-sub">{{ site.description }}</p>
    <span class="hero-badge">&#x1F30D; June 11 &ndash; July 19, 2026</span>
  </section>
  {% endif %}

  <main class="page-content">
    <div class="content-wrapper">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <p>WC 2026 Prediction Game &middot; Updated hourly</p>
  </footer>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    var wrapper = document.querySelector('.content-wrapper');
    if (!wrapper) return;

    // 1. Wrap the Schmeichel heading + following siblings in a gold card
    var schmeichelH1 = Array.from(wrapper.querySelectorAll('h1')).find(function (h) {
      return h.textContent.indexOf('Schmeichel') !== -1;
    });
    if (schmeichelH1) {
      var card = document.createElement('div');
      card.className = 'schmeichel-card';
      schmeichelH1.parentNode.insertBefore(card, schmeichelH1);
      var node = schmeichelH1;
      while (node) {
        var next = node.nextSibling;
        card.appendChild(node);
        if (!next || (next.nodeType === 1 && next.tagName === 'H1')) break;
        node = next;
      }
    }

    // 2. Build sticky nav from team-group h1s (skip Schmeichel)
    var nav = document.getElementById('group-nav');
    wrapper.querySelectorAll('h1').forEach(function (h1) {
      if (h1.textContent.indexOf('Schmeichel') !== -1) return;
      var a = document.createElement('a');
      a.href = '#' + h1.id;
      a.textContent = h1.textContent;
      nav.appendChild(a);
    });

    // 3. Wrap every 3 consecutive group-plot images into a CSS grid
    var imgParas = Array.from(wrapper.querySelectorAll('p > img'))
      .filter(function (img) { return img.src.indexOf('group_plots') !== -1; })
      .map(function (img) { return img.closest('p'); });
    for (var i = 0; i < imgParas.length; i += 3) {
      var trio = imgParas.slice(i, i + 3);
      if (trio.length < 1) break;
      var grid = document.createElement('div');
      grid.className = 'svg-grid';
      trio[0].parentNode.insertBefore(grid, trio[0]);
      trio.forEach(function (p) { grid.appendChild(p); });
    }
  });
  </script>

</body>
</html>
