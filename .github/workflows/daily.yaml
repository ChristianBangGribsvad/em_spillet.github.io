name: Daily Job

on:
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"   # every 10 min, offset from :00 peak load
  workflow_dispatch:    # enables the "Run workflow" button in the Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # opt in early — forced default June 16 2026

jobs:
  run_script:
    name: Run Python Script
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run script
      run: python scripts/main.py

    - name: Commit changes
      run: |
        git config --global user.email "actions@example.com"
        git config --global user.name "GitHub Actions"
        git add .
        git commit -m "Update files via workflow" || echo "No changes to commit"

    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
